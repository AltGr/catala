[project]
name = "catala-runtime"
version = "0.9.0"
dependencies = [
  "gmpy2",
  "typing",
  "mypy",
  "python-dateutil",
  "types-python-dateutil",
  "autopep8",
  "termcolor",
  "types-termcolor",
]

[project.optional-dependencies]
test = [
  "pytest",
  "pytest-cov",
]

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"
